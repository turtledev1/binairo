name: binairo_app
description: Play Binairo puzzles on your phone.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  binairo_core:
    path: ../packages/binairo_core
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#12141A"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
